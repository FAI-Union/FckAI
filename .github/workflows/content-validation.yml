name: Content validation

# Block low-effort or link-farm PRs at the check level.
# Evidence/policy/campaign changes need a source URL in the PR body;
# translations must follow the i18n title convention and update LANGUAGES.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate submission requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check paths, title and source links
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const paths = files.map((file) => file.filename);
            const problems = [];

            const contentPaths = paths.filter((path) =>
              /^(RESEARCH|POLICY|CAMPAIGNS)\/.*\.md$/i.test(path)
            );
            if (contentPaths.length > 0 && !/https?:\/\//i.test(pr.body ?? '')) {
              problems.push(
                'PRs changing RESEARCH/, POLICY/ or CAMPAIGNS/ must include at least one source URL in the description.'
              );
            }

            const localePaths = paths.filter((path) => /^locales\//.test(path));
            if (localePaths.length > 0) {
              if (!/^i18n\([^)]+\):/.test(pr.title ?? '')) {
                problems.push(
                  'Translation PRs must use the title format `i18n(<tag>): add <Language> translation`.'
                );
              }
              if (!paths.includes('LANGUAGES.md')) {
                problems.push('Translation PRs must also update LANGUAGES.md.');
              }
            }

            // Count *added* links from full blobs, not patches: the REST API
            // truncates or omits patches for large diffs, which can bypass the
            // link-farm check. Fail closed if a required blob is unreadable.
            const headRepo = pr.head?.repo;
            async function readText(path, owner, repo, ref) {
              const response = await github.rest.repos.getContent({
                owner, repo, path, ref
              });
              if (response.data?.content && response.data?.encoding === 'base64') {
                return Buffer.from(
                  response.data.content.replace(/\n/g, ''), 'base64'
                ).toString('utf8');
              }
              return null;
            }
            function urlTotal(text) {
              return (text.match(/https?:\/\//gi) ?? []).length;
            }
            let urlCount = 0;
            const markdownFiles = files.filter(
              (file) => file.status !== 'removed' && /\.(md|markdown)$/i.test(file.filename)
            );
            for (const file of markdownFiles) {
              try {
                const headText = await readText(
                  file.filename,
                  headRepo?.owner?.login ?? context.repo.owner,
                  headRepo?.name ?? context.repo.repo,
                  pr.head.sha
                );
                if (headText === null) {
                  problems.push(`Cannot read ${file.filename} from the PR head; link check is incomplete.`);
                  continue;
                }
                let added = urlTotal(headText);
                if (file.status !== 'added') {
                  const baseText = await readText(
                    file.previous_filename || file.filename,
                    context.repo.owner, context.repo.repo, pr.base.sha
                  );
                  if (baseText === null) {
                    problems.push(`Cannot read ${file.filename} from the PR base; link check is incomplete.`);
                    continue;
                  }
                  added = Math.max(0, added - urlTotal(baseText));
                }
                urlCount += added;
              } catch (error) {
                problems.push(`Cannot verify links in ${file.filename}: ${error.message}`);
              }
            }

            if (urlCount > 12) {
              problems.push(
                `Too many new links (${urlCount}). Split promotional links into a separate, reviewed PR.`
              );
            }

            if (problems.length > 0) {
              core.setFailed(problems.join(' '));
            }
