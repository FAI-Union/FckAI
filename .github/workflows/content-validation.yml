name: Content validation

# Block low-effort or link-farm PRs at the check level.
# Evidence/policy/campaign changes need a source URL in the PR body;
# translations must follow the i18n title convention and update LANGUAGES.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate submission requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check paths, title and source links
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const paths = files.map((file) => file.filename);
            const problems = [];

            const contentPaths = paths.filter((path) =>
              /^(RESEARCH|POLICY|CAMPAIGNS)\/.*\.md$/i.test(path)
            );
            if (contentPaths.length > 0 && !/https?:\/\//i.test(pr.body ?? '')) {
              problems.push(
                'PRs changing RESEARCH/, POLICY/ or CAMPAIGNS/ must include at least one source URL in the description.'
              );
            }

            const localePaths = paths.filter((path) => /^locales\//.test(path));
            if (localePaths.length > 0) {
              if (!/^i18n\([^)]+\):/.test(pr.title ?? '')) {
                problems.push(
                  'Translation PRs must use the title format `i18n(<tag>): add <Language> translation`.'
                );
              }
              if (!paths.includes('LANGUAGES.md')) {
                problems.push('Translation PRs must also update LANGUAGES.md.');
              }
            }

            // Count links from patch lines for modified files, but read the full
            // blob for newly added Markdown files: large patches can be omitted
            // or truncated by the REST API, which used to bypass this check.
            const addedMarkdown = files.filter(
              (file) => file.status === 'added' && /\.(md|markdown)$/i.test(file.filename)
            );
            const addedPaths = new Set(addedMarkdown.map((file) => file.filename));
            const patchText = files
              .filter((file) => !addedPaths.has(file.filename))
              .flatMap((file) => (file.patch ?? '').split('\n'))
              .filter((line) => line.startsWith('+') && !line.startsWith('+++'))
              .join('\n');
            let urlCount = (patchText.match(/https?:\/\//gi) ?? []).length;

            const headRepo = pr.head?.repo;
            for (const file of addedMarkdown) {
              try {
                const response = await github.rest.repos.getContent({
                  owner: headRepo?.owner?.login ?? context.repo.owner,
                  repo: headRepo?.name ?? context.repo.repo,
                  path: file.filename,
                  ref: pr.head.sha
                });
                if (response.data?.content && response.data?.encoding === 'base64') {
                  const content = Buffer.from(
                    response.data.content.replace(/\n/g, ''), 'base64'
                  ).toString('utf8');
                  urlCount += (content.match(/https?:\/\//gi) ?? []).length;
                }
              } catch (error) {
                core.warning(`Could not read added file ${file.filename}: ${error.message}`);
              }
            }

            const missingPatch = files.filter(
              (file) => !file.patch && file.status !== 'added' && /\.(md|markdown)$/i.test(file.filename)
            );
            if (missingPatch.length > 0) {
              core.warning(
                `Patch unavailable for ${missingPatch.length} Markdown file(s); link count may be incomplete.`
              );
            }

            if (urlCount > 12) {
              problems.push(
                `Too many new links (${urlCount}). Split promotional links into a separate, reviewed PR.`
              );
            }

            if (problems.length > 0) {
              core.setFailed(problems.join(' '));
            }
